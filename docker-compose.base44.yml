services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: base44dev
      POSTGRES_DB: banking_advisor
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d banking_advisor"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./backend:/app
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:base44dev@db:5432/banking_advisor
      - CORS_ORIGINS=https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python -m seed_data.seed_banks &&
             uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
    expose:
      - "8000"

  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./frontend:/app
    environment:
      - BACKEND_URL=http://backend:8000
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
